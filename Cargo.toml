[workspace]
members = [
    "crates/fish-parser",
    "crates/hook",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
peg = "0.8"
insta = { version = "1.48", features = ["yaml"] }
